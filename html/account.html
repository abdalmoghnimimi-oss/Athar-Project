<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الحساب - أثر</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>أثر</h1>
        <p>متحف الأشياء المنسية</p>
    </header>


    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="museum.html">المتحف</a>
        <a href="story.html">قصتنا</a>
        <a href="account.html">الحساب</a>
        <a href="contact.html">تواصل معنا</a>
    </nav>


    <section>

        <h2>تسجيل الدخول</h2>

        <form onsubmit="return loginValidation()">

            <label>البريد الإلكتروني:</label>
            <input type="email" id="loginEmail" required>

            <label>كلمة المرور:</label>
            <input type="password" id="loginPassword" minlength="6" required>

            <button type="submit">تسجيل الدخول</button>

        </form>


        <hr>


        <h2>إنشاء حساب</h2>

        <form onsubmit="return registerValidation()">

            <label>الاسم:</label>
            <input type="text" id="registerName" required>

            <label>البريد الإلكتروني:</label>
            <input type="email" id="registerEmail" required>

            <label>كلمة المرور:</label>
            <input type="password" id="registerPassword" minlength="6" required>

            <button type="submit">إنشاء حساب</button>

        </form>

    </section>


    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متحف أثر</p>
    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
